{% extends "base.html" %}
{% load static %}
{% block meta %}
    <title>Experience - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Perjalanan saya sejauh ini</p>
                <h1>Experience</h1>

                <form id="experience-search-form" class="project-search" role="search">
                    <input id="experience-search"
                           class="project-search__input"
                           type="search"
                           placeholder="Cari judul pengalaman"
                           aria-label="Cari judul pengalaman">
                    <button class="button" type="submit">Cari</button>
                </form>

                <p id="experience-status" class="empty-state" role="status" aria-live="polite">
                    Memuat data pengalaman...
                </p>
                <div id="experience-list"
                     class="experience-grid"
                     data-api-url="{% url 'main:get_experience_json' %}"></div>
            </div>
        </section>
    </main>
    <script src="{% static 'js/experience.js' %}" defer></script>
{% endblock content %}
